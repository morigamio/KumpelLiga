<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KumpelLiga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5;            /* cozy warm white */
    --bg2:#f2efe9;
    --card:#ffffff;
    --text:#2b2a27;
    --muted:#8a8577;
    --border:#ece7df;
    --border-strong:#ddd6ca;
    --accent:#2f7d55;        /* pitch green */
    --accent-soft:#e7f2ec;
    --accent-fg:#ffffff;
    --gold:#c8952b;
    --danger:#c0392b;
    --danger-soft:#fbeceb;
    --shadow:0 6px 24px rgba(60,50,30,.07), 0 1px 3px rgba(60,50,30,.06);
    --shadow-lg:0 18px 50px rgba(60,50,30,.14);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #fff 0%, var(--bg) 55%, var(--bg2) 100%);
    color:var(--text);line-height:1.5;min-height:100%;
  }
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;
    background:var(--accent);color:var(--accent-fg);font-weight:700;transition:.15s ease}
  button:hover{filter:brightness(1.05)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
  button.ghost{background:var(--bg2);color:var(--text)}
  button.ghost:hover{background:var(--border)}
  button.link{background:none;color:var(--muted);padding:6px 4px;font-weight:600}
  button.link:hover{color:var(--text);filter:none}
  button.danger{background:var(--danger-soft);color:var(--danger)}
  input{width:100%;padding:12px 14px;border:1.5px solid var(--border-strong);border-radius:11px;
    background:#fff;color:var(--text);font-size:15px;font-family:inherit;transition:.15s ease}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
  .muted{color:var(--muted)}
  .hide{display:none!important}
  .msg{font-size:13.5px;margin-top:12px;min-height:18px;font-weight:600}
  .msg.err{color:var(--danger)}
  .msg.ok{color:var(--accent)}

  /* ---------- AUTH ---------- */
  #authView{min-height:100vh;display:grid;place-items:center;padding:24px}
  .auth-card{width:100%;max-width:390px;background:var(--card);border:1px solid var(--border);
    border-radius:22px;box-shadow:var(--shadow-lg);padding:34px 30px 30px}
  .brand{text-align:center;margin-bottom:22px}
  .brand .logo{font-size:40px;line-height:1}
  .brand h1{margin:8px 0 2px;font-size:26px;font-weight:800;letter-spacing:.4px}
  .brand p{margin:0;font-size:14px;color:var(--muted)}
  .segmented{display:flex;background:var(--bg2);border-radius:12px;padding:4px;margin-bottom:6px}
  .segmented button{flex:1;background:none;color:var(--muted);border-radius:9px;padding:9px;font-weight:700}
  .segmented button.active{background:#fff;color:var(--text);box-shadow:var(--shadow)}
  .auth-card .submit{width:100%;margin-top:20px;padding:13px}

  /* ---------- SHELL ---------- */
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border)}
  header .brand-row{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:.4px}
  header .brand-row .logo{font-size:22px}
  header .user{display:flex;align-items:center;gap:12px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:15px}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 60px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:800}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

  /* account hero */
  .hero{display:flex;align-items:center;gap:18px}
  .hero .big-avatar{width:64px;height:64px;border-radius:20px;background:linear-gradient(140deg,var(--accent),#255f42);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:26px;box-shadow:var(--shadow)}
  .hero .who{flex:1}
  .hero .who .name{font-size:24px;font-weight:800;margin:0}
  .hero .who .sub{font-size:13.5px;color:var(--muted)}
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px dashed var(--border-strong)}
  .stat .n{font-size:22px;font-weight:800}
  .stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}

  /* leagues list */
  .league-item{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--border);
    border-radius:13px;margin-bottom:10px;cursor:pointer;transition:.15s ease;background:#fff}
  .league-item:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
  .league-item .crest{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:800;font-size:17px;flex-shrink:0}
  .league-item .li-main{flex:1;min-width:0}
  .league-item .li-name{font-weight:800;font-size:16px}
  .league-item .li-sub{font-size:13px;color:var(--muted)}
  .league-item .li-bal{text-align:right}
  .league-item .li-bal .b{font-weight:800;font-size:16px;color:var(--accent)}
  .league-item .li-bal .bl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .chev{color:var(--muted);font-size:20px}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-weight:600}

  .join-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:620px){.join-grid{grid-template-columns:1fr}}
  .join-grid .col{border:1px solid var(--border);border-radius:13px;padding:16px}
  .join-grid h3{margin:0 0 2px;font-size:15px;font-weight:800}
  .join-grid .hint{font-size:12.5px;color:var(--muted);margin-bottom:4px}

  /* ---------- LEAGUE VIEW ---------- */
  .league-head{display:flex;align-items:center;gap:16px}
  .league-head .crest{width:56px;height:56px;border-radius:16px;background:linear-gradient(140deg,var(--accent),#255f42);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
  .league-head h1{margin:0;font-size:23px;font-weight:800}
  .league-head .sub{font-size:13.5px;color:var(--muted)}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;
    background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
  .pill.gold{background:#faf1dc;color:var(--gold)}

  /* slider */
  .slider-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .slider-head .nav{display:flex;gap:8px}
  .slider-head .nav button{background:var(--bg2);color:var(--text);width:38px;height:38px;padding:0;
    border-radius:11px;font-size:18px;display:grid;place-items:center}
  .day-label{font-weight:800;font-size:16px}
  .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;margin:0 -4px}
  .track::-webkit-scrollbar{height:0}
  .slide{flex:0 0 100%;scroll-snap-align:center;padding:0 4px}
  .dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);cursor:pointer;transition:.15s;border:none;padding:0}
  .dot.active{background:var(--accent);width:22px;border-radius:5px}

  /* game card */
  .game{border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:12px;background:#fff}
  .game.locked{background:var(--bg2)}
  .game .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .game .when{font-size:12.5px;color:var(--muted);font-weight:700}
  .game .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:6px}
  .game .team{font-weight:800;font-size:15.5px}
  .game .team.home{text-align:right}
  .game .team.away{text-align:left}
  .game .vs{font-size:12px;color:var(--muted);font-weight:800}
  .game .score{font-size:20px;font-weight:800;padding:2px 12px;background:var(--accent-soft);border-radius:10px;color:var(--accent)}
  .odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
  .odds .opt{background:#fff;border:1.5px solid var(--border-strong);color:var(--text);border-radius:12px;
    padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700}
  .odds .opt:hover:not(:disabled){border-color:var(--accent)}
  .odds .opt .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:800;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .odds .opt .v{font-size:17px;font-weight:800}
  .odds .opt.chosen{background:var(--accent);border-color:var(--accent);color:#fff}
  .odds .opt.chosen .k{color:#fff;opacity:.9}
  .bet-note{font-size:12.5px;color:var(--muted);margin-top:9px;font-weight:600;min-height:16px}
  .bet-note.you{color:var(--accent)}
  .bet-note.err{color:var(--danger)}
  .no-odds{font-size:12.5px;color:var(--muted);margin-top:10px;font-weight:600}

  /* ranking */
  table.rank{width:100%;border-collapse:collapse}
  table.rank th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    font-weight:800;padding:8px 10px;border-bottom:1.5px solid var(--border)}
  table.rank th.r{text-align:right}
  table.rank td{padding:11px 10px;border-bottom:1px solid var(--border);font-weight:600}
  table.rank td.r{text-align:right;font-weight:800}
  table.rank tr.me{background:var(--accent-soft)}
  .rk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--bg2);
    font-weight:800;font-size:13px}
  .rk.g1{background:#f7e7bf;color:#9a6f12}
  .rk.g2{background:#e9e9ee;color:#6b6b76}
  .rk.g3{background:#f0dcc9;color:#98603a}
  .status-tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}

  .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="authView">
  <div class="auth-card">
    <div class="brand">
      <div class="logo">⚽</div>
      <h1>KumpelLiga</h1>
      <p>Bet with your buddies, not your wallet.</p>
    </div>
    <div class="segmented">
      <button id="segLogin" class="active" onclick="setAuthMode('login')">Login</button>
      <button id="segReg" onclick="setAuthMode('reg')">Register</button>
    </div>
    <label>Username</label>
    <input id="authName" autocomplete="username" placeholder="your name">
    <label>Password</label>
    <input id="authPass" type="password" autocomplete="current-password" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')submitAuth()">
    <button class="submit" id="authBtn" onclick="submitAuth()">Login</button>
    <div id="authMsg" class="msg"></div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="hide">
  <header>
    <div class="brand-row"><span class="logo">⚽</span> KumpelLiga</div>
    <div class="user">
      <span class="muted" id="hdrName" style="font-weight:700"></span>
      <div class="avatar" id="hdrAvatar">?</div>
      <button class="ghost" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- ---- HOME ---- -->
  <div id="homeView" class="wrap">

    <div class="card">
      <div class="hero">
        <div class="big-avatar" id="acctAvatar">?</div>
        <div class="who">
          <p class="name" id="acctName">—</p>
          <div class="sub" id="acctSub"></div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="n" id="statLeagues">–</div><div class="l">Leagues</div></div>
        <div class="stat"><div class="n" id="statPoints">–</div><div class="l">Total points</div></div>
        <div class="stat"><div class="n" id="statBest">–</div><div class="l">Best rank</div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">
        <h2>My leagues</h2>
        <button class="link" onclick="loadHome()">↻ Refresh</button>
      </div>
      <div id="myLeagues"></div>
    </div>

    <div class="card">
      <h2>Find a league</h2>
      <div class="join-grid">
        <div class="col">
          <h3>Join a league</h3>
          <div class="hint">Enter the league's name and password.</div>
          <label>League name</label>
          <input id="joinId" placeholder="e.g. Kumpel Bundesliga">
          <label>Password</label>
          <input id="joinPass" type="password" placeholder="league password">
          <button style="width:100%;margin-top:16px" onclick="joinLeague()">Join league</button>
        </div>
        <div class="col">
          <h3>Create a league</h3>
          <div class="hint">You'll be the admin and first member.</div>
          <label>League name</label>
          <input id="lgName" placeholder="Kumpel Bundesliga">
          <label>Password</label>
          <input id="lgPass" type="password" placeholder="choose a password">
          <button class="ghost" style="width:100%;margin-top:16px" onclick="createLeague()">Create league</button>
        </div>
      </div>
      <div id="homeMsg" class="msg"></div>
    </div>
  </div>

  <!-- ---- LEAGUE ---- -->
  <div id="leagueView" class="wrap hide">
    <button class="link" onclick="goHome()">← All leagues</button>

    <div class="card">
      <div class="league-head">
        <div class="crest" id="lvCrest">L</div>
        <div style="flex:1">
          <h1 id="lvName">League</h1>
          <div class="sub" id="lvSub"></div>
        </div>
        <div id="lvActions"></div>
      </div>
    </div>

    <div class="card">
      <div class="slider-head">
        <div class="day-label" id="dayLabel">Matchday</div>
        <div class="nav">
          <button onclick="slideBy(-1)" aria-label="Previous matchday">‹</button>
          <button onclick="slideBy(1)" aria-label="Next matchday">›</button>
        </div>
      </div>
      <div class="track" id="track"></div>
      <div class="dots" id="dots"></div>
      <div id="gamesMsg" class="msg"></div>
    </div>

    <div class="card">
      <div class="section-title"><h2>Ranking</h2></div>
      <div id="ranking"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------------- state ---------------- */
let authMode = 'login';
let ME = null;                 // account name
let myLeaguesCache = [];       // [{league, myParticipant}]
let cur = null;                // current open league context

/* ---------------- storage ---------------- */
const token       = () => localStorage.getItem('kl_token');
const setToken    = t  => localStorage.setItem('kl_token', t);
const clearToken  = () => localStorage.removeItem('kl_token');

/* ---------------- api helper ---------------- */
async function api(method, path, body){
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  const t = token();
  if (t) headers['Authorization'] = 'Bearer ' + t;
  const res = await fetch(path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  const text = await res.text();
  let data = text;
  try { data = text ? JSON.parse(text) : null; } catch(_) {}
  return {ok: res.ok, status: res.status, data, text};
}

/* ================= AUTH ================= */
function setAuthMode(mode){
  authMode = mode;
  $('segLogin').classList.toggle('active', mode==='login');
  $('segReg').classList.toggle('active', mode==='reg');
  $('authBtn').textContent = mode==='login' ? 'Login' : 'Create account';
  $('authMsg').textContent = '';
}

async function submitAuth(){
  const name = $('authName').value.trim();
  const password = $('authPass').value;
  const msg = $('authMsg'); msg.className='msg';
  if (!name || !password){ msg.className='msg err'; msg.textContent='Username and password required.'; return; }
  $('authBtn').disabled = true;
  try{
    if (authMode === 'reg'){
      const r = await api('POST','/account',{name,password});
      if (!r.ok){ msg.className='msg err'; msg.textContent = r.text || 'Registration failed.'; return; }
    }
    const r = await api('POST','/session',{name,password});
    if (!r.ok){ msg.className='msg err'; msg.textContent = r.text || 'Login failed.'; return; }
    setToken(r.text.trim());
    localStorage.setItem('kl_user', name);
    enterApp();
  } finally { $('authBtn').disabled = false; }
}

function logout(){
  api('DELETE','/session').catch(()=>{});
  clearToken();
  localStorage.removeItem('kl_user');
  location.reload();
}

function enterApp(){
  $('authView').classList.add('hide');
  $('appShell').classList.remove('hide');
  loadHome();
}

/* ================= HOME ================= */
async function loadHome(){
  goHome();
  const acct = await api('GET','/account');
  if (acct.status === 401){ logout(); return; }
  ME = acct.ok ? acct.data.name : localStorage.getItem('kl_user');
  const initial = (ME||'?').charAt(0).toUpperCase();
  $('hdrName').textContent = ME || '';
  $('hdrAvatar').textContent = initial;
  $('acctAvatar').textContent = initial;
  $('acctName').textContent = ME || '—';
  $('acctSub').textContent = acct.ok ? ('Account #' + acct.data.id) : '';

  $('myLeagues').innerHTML = '<div class="empty"><span class="spinner"></span></div>';

  const all = await api('GET','/leagues');
  if (!all.ok){ $('myLeagues').innerHTML = '<div class="empty">Could not load leagues.</div>'; return; }

  // "my leagues" = leagues where a participant carries my name
  const mine = [];
  for (const lg of all.data){
    const mp = (lg.participants||[]).find(p => p.name === ME);
    if (mp) mine.push({league: lg, myParticipant: mp});
  }
  myLeaguesCache = mine;
  renderMyLeagues(mine);
  renderAcctStats(mine);
}

function renderAcctStats(mine){
  $('statLeagues').textContent = mine.length;
  const totalPts = mine.reduce((s,x)=> s + Number(x.myParticipant.balance||0), 0);
  $('statPoints').textContent = mine.length ? Math.round(totalPts) : '–';
  $('statBest').textContent = '–'; // filled after ranks resolve
  if (!mine.length) return;
  // resolve best rank across leagues (uses ranking endpoint)
  Promise.all(mine.map(x => api('GET','/leagues/'+x.league.id+'/ranking'))).then(res=>{
    let best = Infinity;
    res.forEach(r=>{
      if (!r.ok) return;
      const idx = r.data.findIndex(p => p.name === ME);
      if (idx >= 0) best = Math.min(best, idx+1);
    });
    $('statBest').textContent = best === Infinity ? '–' : '#'+best;
  });
}

function renderMyLeagues(mine){
  const box = $('myLeagues');
  if (!mine.length){
    box.innerHTML = '<div class="empty">You are not in any league yet.<br>Join or create one below to start betting. 👇</div>';
    return;
  }
  box.innerHTML = '';
  for (const {league, myParticipant} of mine){
    const el = document.createElement('div');
    el.className = 'league-item';
    el.onclick = () => openLeague(league.id);
    const members = (league.participants||[]).length;
    el.innerHTML =
      '<div class="crest">'+escapeHtml((league.name||'?').charAt(0).toUpperCase())+'</div>'+
      '<div class="li-main">'+
        '<div class="li-name">'+escapeHtml(league.name)+'</div>'+
        '<div class="li-sub">'+members+' member'+(members===1?'':'s')+
          ' · admin '+escapeHtml(league.admin)+
          (myParticipant.status && myParticipant.status.toUpperCase()!=='APPROVED'
             ? ' · <b>'+escapeHtml(myParticipant.status)+'</b>' : '')+
        '</div>'+
      '</div>'+
      '<div class="li-bal"><div class="b">'+fmtPts(myParticipant.balance)+'</div><div class="bl">points</div></div>'+
      '<div class="chev">›</div>';
    box.appendChild(el);
  }
}

async function joinLeague(){
  const name = $('joinId').value.trim();
  const password = $('joinPass').value;
  const msg = $('homeMsg'); msg.className='msg';
  if (!name || !password){ msg.className='msg err'; msg.textContent='League name and password required.'; return; }

  // League names are unique: look the name up, then join with its id (never send a
  // non-numeric value to the server, which would throw NumberFormatException on parseLong).
  const found = await api('GET','/leagues?name='+encodeURIComponent(name));
  if (!found.ok){ msg.className='msg err'; msg.textContent = found.text || 'Could not search leagues.'; return; }
  const league = (found.data||[]).find(l => l.name && l.name.toLowerCase() === name.toLowerCase());
  if (!league){ msg.className='msg err'; msg.textContent = 'No league named "'+name+'".'; return; }
  const leagueId = league.id;

  const r = await api('POST','/leagues/'+leagueId+'/participants',{password});
  if (!r.ok){ msg.className='msg err'; msg.textContent = r.text || 'Could not join league.'; return; }
  msg.className='msg ok'; msg.textContent='Joined! Opening league…';
  $('joinId').value=''; $('joinPass').value='';
  await loadHome();
  openLeague(Number(leagueId));
}

async function createLeague(){
  const name = $('lgName').value.trim();
  const password = $('lgPass').value;
  const msg = $('homeMsg'); msg.className='msg';
  if (!name || !password){ msg.className='msg err'; msg.textContent='League name and password required.'; return; }
  const r = await api('POST','/leagues',{name,password});
  if (!r.ok){ msg.className='msg err'; msg.textContent = r.text || 'Could not create league.'; return; }
  msg.className='msg ok'; msg.textContent='League "'+r.data.name+'" created (ID '+r.data.id+').';
  $('lgName').value=''; $('lgPass').value='';
  await loadHome();
  openLeague(r.data.id);
}

/* ================= LEAGUE ================= */
function goHome(){
  $('leagueView').classList.add('hide');
  $('homeView').classList.remove('hide');
  window.scrollTo(0,0);
}

async function openLeague(leagueId){
  $('homeView').classList.add('hide');
  $('leagueView').classList.remove('hide');
  window.scrollTo(0,0);
  $('track').innerHTML = '<div style="padding:30px;text-align:center"><span class="spinner"></span></div>';
  $('dots').innerHTML = '';
  $('ranking').innerHTML = '';
  $('gamesMsg').textContent = '';

  const lgRes = await api('GET','/leagues/'+leagueId);
  if (!lgRes.ok){ $('gamesMsg').className='msg err'; $('gamesMsg').textContent='Could not open league.'; return; }
  const league = lgRes.data;
  const myParticipant = (league.participants||[]).find(p => p.name === ME);

  cur = { league, myParticipant, games: [], days: [], dayIndex: 0, betsByGame: {} };

  // header
  $('lvCrest').textContent = (league.name||'?').charAt(0).toUpperCase();
  $('lvName').textContent = league.name;
  const iAmAdmin = league.admin === ME;
  $('lvSub').innerHTML = (league.participants||[]).length+' members · admin '+escapeHtml(league.admin)+
     '  <span class="pill">'+fmtPts(myParticipant ? myParticipant.balance : 0)+' pts</span>';
  renderLeagueActions(league, myParticipant, iAmAdmin);

  // parallel: games, my bets, ranking
  const [gamesRes, betsRes, rankRes] = await Promise.all([
    api('GET','/games'),
    myParticipant ? api('GET','/participants/'+myParticipant.id+'/bets') : Promise.resolve({ok:true,data:[]}),
    api('GET','/leagues/'+leagueId+'/ranking')
  ]);

  if (betsRes.ok && Array.isArray(betsRes.data)){
    for (const b of betsRes.data) if (b.gameId != null) cur.betsByGame[b.gameId] = b;
  }
  if (gamesRes.ok) renderSlider(gamesRes.data);
  else { $('gamesMsg').className='msg err'; $('gamesMsg').textContent='Could not load games.'; }

  if (rankRes.ok) renderRanking(rankRes.data);
  else $('ranking').innerHTML = '<div class="empty">Could not load ranking.</div>';
}

function renderLeagueActions(league, myParticipant, iAmAdmin){
  const box = $('lvActions'); box.innerHTML='';
  if (iAmAdmin){
    const b = document.createElement('button');
    b.className='danger'; b.textContent='Delete league';
    b.onclick = async ()=>{
      if (!confirm('Delete "'+league.name+'" for everyone? This cannot be undone.')) return;
      const r = await api('DELETE','/leagues/'+league.id);
      if (r.ok){ await loadHome(); } else alert(r.text||'Could not delete league.');
    };
    box.appendChild(b);
  } else if (myParticipant){
    const b = document.createElement('button');
    b.className='danger'; b.textContent='Leave';
    b.onclick = async ()=>{
      if (!confirm('Leave "'+league.name+'"?')) return;
      const r = await api('DELETE','/participants/'+myParticipant.id);
      if (r.ok){ await loadHome(); } else alert(r.text||'Could not leave league.');
    };
    box.appendChild(b);
  }
}

/* ---- gameday slider ---- */
function renderSlider(games){
  games = (games||[]).slice().sort((a,b)=> (a.gameDay-b.gameDay) || (new Date(a.matchTime)-new Date(b.matchTime)));
  cur.games = games;
  if (!games.length){
    $('track').innerHTML=''; $('dots').innerHTML='';
    $('dayLabel').textContent='No games';
    $('gamesMsg').className='msg'; $('gamesMsg').textContent='No games available yet.';
    return;
  }
  const days = [...new Set(games.map(g=>g.gameDay))].sort((a,b)=>a-b);
  cur.days = days;
  cur.dayIndex = defaultDayIndex(games, days);

  const track = $('track'); track.innerHTML='';
  days.forEach(day=>{
    const slide = document.createElement('div');
    slide.className='slide';
    const dayGames = games.filter(g=>g.gameDay===day);
    dayGames.forEach(g => slide.appendChild(renderGameCard(g)));
    track.appendChild(slide);
  });

  // dots
  const dots = $('dots'); dots.innerHTML='';
  days.forEach((day,i)=>{
    const d = document.createElement('button');
    d.className='dot'+(i===cur.dayIndex?' active':'');
    d.title='Matchday '+day;
    d.onclick=()=>scrollToDay(i);
    dots.appendChild(d);
  });

  track.onscroll = () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (i !== cur.dayIndex){ cur.dayIndex = i; syncDayUi(); }
  };
  // jump (no smooth) to default day
  requestAnimationFrame(()=>{ track.scrollLeft = cur.dayIndex * track.clientWidth; syncDayUi(); });
}

function defaultDayIndex(games, days){
  const now = Date.now();
  const upcoming = games.find(g => !g.isFinished && new Date(g.matchTime).getTime() >= now);
  const day = upcoming ? upcoming.gameDay : days[days.length-1];
  return Math.max(0, days.indexOf(day));
}

function syncDayUi(){
  $('dayLabel').textContent = 'Matchday ' + cur.days[cur.dayIndex];
  [...$('dots').children].forEach((d,i)=> d.classList.toggle('active', i===cur.dayIndex));
}
function scrollToDay(i){
  i = Math.max(0, Math.min(i, cur.days.length-1));
  cur.dayIndex = i;
  $('track').scrollTo({left: i * $('track').clientWidth, behavior:'smooth'});
  syncDayUi();
}
function slideBy(d){ scrollToDay(cur.dayIndex + d); }

/* ---- game card + betting ---- */
function hasOdds(g){ return g.oddsHome>0 || g.oddsAway>0 || g.oddsDraw>0; }
function isLocked(g){
  return g.isFinished || (g.matchTime && new Date(g.matchTime).getTime() <= Date.now());
}

function renderGameCard(g){
  const div = document.createElement('div');
  div.className = 'game' + (isLocked(g) ? ' locked' : '');

  const finished = g.isFinished;
  const scoreOrVs = finished
    ? '<span class="score">'+g.goalsHomeTeam+' : '+g.goalsAwayTeam+'</span>'
    : '<span class="vs">vs</span>';

  div.innerHTML =
    '<div class="top">'+
      '<span class="when">'+fmt(g.matchTime)+'</span>'+
      '<span class="pill'+(finished?' gold':'')+'">'+(finished?'Full time':'Matchday '+g.gameDay)+'</span>'+
    '</div>'+
    '<div class="teams">'+
      '<span class="team home">'+escapeHtml(g.homeTeam)+'</span>'+
      scoreOrVs+
      '<span class="team away">'+escapeHtml(g.awayTeam)+'</span>'+
    '</div>';

  if (!hasOdds(g)){
    const n = document.createElement('div'); n.className='no-odds';
    n.textContent = finished ? 'No odds were offered for this game.' : 'No odds yet — betting opens once odds are set.';
    div.appendChild(n);
    return div;
  }

  const existing = cur.betsByGame[g.id];   // {id, gameId, prediction, stake} or undefined
  const locked = isLocked(g);
  const outcomes = [
    {label:g.homeTeam, pred:'homeTeam', val:g.oddsHome},
    {label:'Draw',     pred:'draw',     val:g.oddsDraw},
    {label:g.awayTeam, pred:'awayTeam', val:g.oddsAway},
  ];
  const odds = document.createElement('div'); odds.className='odds';
  outcomes.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'opt' + (existing && existing.prediction===o.pred ? ' chosen' : '');
    b.innerHTML = '<span class="k">'+escapeHtml(o.label)+'</span><span class="v">'+o.val.toFixed(2)+'</span>';
    if (locked) b.disabled = true;
    else b.onclick = () => onBetClick(g, o.pred, div);
    odds.appendChild(b);
  });
  div.appendChild(odds);

  const note = document.createElement('div'); note.className='bet-note';
  if (locked && !existing) note.textContent = 'Betting closed.';
  else if (locked && existing) { note.className='bet-note you'; note.textContent='Your pick: '+labelFor(g, existing.prediction)+' (locked)'; }
  else if (existing) { note.className='bet-note you'; note.textContent='Your bet: '+labelFor(g, existing.prediction)+' — tap it again to remove, or pick another to change.'; }
  else note.textContent = 'Tap an outcome to place your bet.';
  div.appendChild(note);

  return div;
}

function labelFor(g, pred){
  return pred==='homeTeam' ? g.homeTeam : pred==='awayTeam' ? g.awayTeam : 'Draw';
}

async function onBetClick(g, prediction, card){
  const note = card.querySelector('.bet-note');
  const existing = cur.betsByGame[g.id];
  card.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  note.className='bet-note'; note.innerHTML='<span class="spinner"></span>';

  let r;
  if (!existing){
    r = await api('POST','/leagues/'+cur.league.id+'/games/'+g.id+'/bets',{prediction});
  } else if (existing.prediction === prediction){
    r = await api('DELETE','/bets/'+existing.id);        // tap current pick again → remove
    if (r.ok) delete cur.betsByGame[g.id];
  } else {
    r = await api('PUT','/bets/'+existing.id,{prediction}); // different pick → change
  }

  if (!r.ok){
    note.className='bet-note err'; note.textContent = r.text || 'Bet failed.';
    card.querySelectorAll('.opt').forEach(b=>b.disabled=false);
    return;
  }
  if (r.data && r.data.id != null) cur.betsByGame[g.id] = r.data;  // POST/PUT return the bet

  // re-render just this card in place
  const fresh = renderGameCard(g);
  card.replaceWith(fresh);
  // refresh ranking + my points (balance may change on settlement, but reflect membership too)
  refreshRanking();
}

async function refreshRanking(){
  const r = await api('GET','/leagues/'+cur.league.id+'/ranking');
  if (r.ok) renderRanking(r.data);
}

/* ---- ranking ---- */
function renderRanking(list){
  const box = $('ranking');
  if (!list || !list.length){ box.innerHTML='<div class="empty">No members yet.</div>'; return; }
  let rows='';
  list.forEach((p,i)=>{
    const rank=i+1;
    const g = rank<=3 ? ' g'+rank : '';
    rows += '<tr class="'+(p.name===ME?'me':'')+'">'+
      '<td><span class="rk'+g+'">'+rank+'</span></td>'+
      '<td>'+escapeHtml(p.name)+(p.name===ME?' <span class="status-tag">you</span>':'')+
        (p.status && p.status.toUpperCase()!=='APPROVED' ? ' <span class="status-tag">'+escapeHtml(p.status)+'</span>':'')+'</td>'+
      '<td class="r">'+fmtPts(p.balance)+'</td>'+
    '</tr>';
  });
  box.innerHTML =
    '<table class="rank"><thead><tr><th>#</th><th>Member</th><th class="r">Points</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table>';
}

/* ---------------- utils ---------------- */
function fmt(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString(undefined,{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}
function fmtPts(v){
  const n = Number(v||0);
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- boot ---------------- */
if (token()) enterApp();
