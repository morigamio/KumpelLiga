<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KumpelLiga – Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <div class="logo">⚽</div>
      <h1>KumpelLiga</h1>
      <p>Bet with your buddies, not your wallet.</p>
    </div>
    <div class="segmented">
      <button id="segLogin" class="active" onclick="setAuthMode('login')">Login</button>
      <button id="segReg" onclick="setAuthMode('reg')">Register</button>
    </div>
    <label>Username</label>
    <input id="authName" autocomplete="username" placeholder="your name">
    <label>Password</label>
    <input id="authPass" type="password" autocomplete="current-password" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')submitAuth()">
    <button class="submit" id="authBtn" onclick="submitAuth()">Login</button>
    <div id="authMsg" class="msg"></div>
  </div>
</div>

</body>
</html>
